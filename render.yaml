services:
  - type: web
    name: grow-twilio
    env: docker
    dockerfilePath: ./waha/Dockerfile
    dockerContext: ./waha
    plan: free
    envVars:
      - key: WHATSAPP_DEFAULT_ENGINE
        value: NOWEB
      - key: WAHA_API_KEY
        value: waha-key-123
      - key: WAHA_DASHBOARD_USERNAME
        value: admin
      - key: WAHA_DASHBOARD_PASSWORD
        value: admin123
      - key: WHATSAPP_SWAGGER_USERNAME
        value: admin
      - key: WHATSAPP_SWAGGER_PASSWORD
        value: admin123
      - key: WAHA_DASHBOARD_NO_PASSWORD
        value: "true"
      - key: WHATSAPP_SWAGGER_NO_PASSWORD
        value: "true"
